<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑफर आँकड़े</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; background: #f4f6f8; }
        .sidebar { width: 240px; background: #fff; height: 100vh; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); position: fixed; }
        .sidebar h2 { color: #007bff; font-size: 20px; margin-bottom: 30px; }
        .sidebar nav a { display: block; padding: 12px; color: #333; text-decoration: none; border-radius: 4px; margin-bottom: 5px; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #e9ecef; color: #007bff; }
        .content { margin-left: 280px; padding: 30px; width: calc(100% - 280px); }
        .content h1 { color: #333; margin-top: 0; }
        .content p { color: #666; margin-bottom: 20px; }
        .summary-cards { display: grid; grid-cols: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card .title { font-size: 14px; color: #555; margin-bottom: 10px; }
        .card .value { font-size: 24px; font-weight: bold; }
        .card.card-blue { border-top: 4px solid #007bff; }
        .card.card-orange { border-top: 4px solid #fd7e14; }
        .card.card-red { border-top: 4px solid #dc3545; }
        .card.card-green { border-top: 4px solid #28a745; }
        .filters { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 30px; display: grid; grid-cols: repeat(3, 1fr); gap: 20px; align-items: end; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 14px; color: #555; margin-bottom: 5px; }
        .filter-group input, .filter-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-apply { padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NexOffers</h2>
        <nav>
            <a href="#">डैशबोर्ड</a>
            <a href="#">सभी ऑफर्स</a>
            <a href="#">मेरे ऑफर्स</a>
            <a href="#" class="active">ऑफर आँकड़े</a>
        </nav>
    </div>
    <div class="content">
        <h1>ऑफर आँकड़े</h1>
        <p>आपकी परफॉरमेंस और एनालिटिक्स</p>

        <div class="summary-cards">
            <div class="card card-blue">
                <span class="title">कुल क्लिक</span>
                <span class="value">0</span>
            </div>
            <div class="card card-orange">
                <span class="title">यूनीक क्लिक</span>
                <span class="value">0</span>
            </div>
            <div class="card card-red">
                <span class="title">कुल कन्वर्जन</span>
                <span class="value">0</span>
            </div>
            <div class="card card-green">
                <span class="title">कन्वर्जन रेट</span>
                <span class="value">0%</span>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="start-date">शुरू होने की तारीख</label>
                <input type="date" id="start-date">
            </div>
            <div class="filter-group">
                <label for="end-date">खत्म होने की तारीख</label>
                <input type="date" id="end-date">
            </div>
            <div class="filter-group">
                <label for="offer">ऑफर</label>
                <select id="offer">
                    <option value="all">सभी ऑफर्स</option>
                </select>
            </div>
            <button class="btn-apply">लागू करें</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ऑफर आईडी</th>
                    <th>ऑफर नाम</th>
                    <th>क्लिक</th>
                    <th>यूनीक क्लिक</th>
                    <th>कन्वर्जन</th>
                    <th>कन्वर्जन %</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" style="text-align: center; color: #777;">कोई डेटा नहीं मिला</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
