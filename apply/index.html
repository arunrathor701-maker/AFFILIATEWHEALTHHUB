<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Details & Proceed - AffiliateWealthHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDO65rF0YI5ifcFnXEwJIy8bGFeSTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const offerId = params.get('offerId') || '1';
        const publisherId = params.get('publisherId') || '';
        const sub1 = params.get('sub1') || 'Direct';
        const targetUrl = params.get('url') || 'https://netex.jump2cloud.org/click?aid=787&oid=583';

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying & Redirecting...";

            const customerName = document.getElementById('name').value.trim();
            const customerPhone = document.getElementById('phone').value.trim();
            const customerPan = document.getElementById('pan').value.trim().toUpperCase();

            try {
                const clickRef = doc(collection(db, "clicks"));
                await setDoc(clickRef, {
                    clickId: clickRef.id,
                    offerId,
                    publisherId,
                    sub1,
                    customerName,
                    customerPhone,
                    customerPan,
                    status: 'recorded',
                    createdAt: new Date().toISOString()
                });
                window.location.href = targetUrl;
            } catch (err) {
                alert("Error saving details: " + err.message);
                btn.disabled = false;
                btn.innerText = "Proceed to Offer";
            }
        });
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md">
        <div class="text-center mb-5">
            <h2 class="text-xl font-bold text-gray-800">Complete Your Verification</h2>
            <p class="text-xs text-gray-500 mt-1">Enter your details below to continue to the offer</p>
        </div>
        <form id="leadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name (As per PAN)</label>
                <input type="text" id="name" placeholder="Enter your full name" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mobile Number</label>
                <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">PAN Card Number</label>
                <input type="text" id="pan" placeholder="ABCDE1234F" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}" maxlength="10" required class="w-full mt-1 p-2.5 border rounded-lg uppercase focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Proceed to Offer</button>
        </form>
    </div>
</body>
</html>
