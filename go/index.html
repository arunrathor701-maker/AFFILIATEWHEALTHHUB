<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - AffiliateWealthHub</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey:"AIzaSyDO65rF0YI5ifcFnXEwJIy8bGFeSTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a",
            measurementId: "G-PX59VJN9TK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function processRedirect() {
            const params = new URLSearchParams(window.location.search);
            const offerId = params.get("oid");
            const publisherId = params.get("pid") || "direct";
            const sub1 = params.get("sub1") || "";

            if (!offerId) {
                document.getElementById("statusText").innerText = "Invalid tracking link (Missing Offer ID).";
                return;
            }

            try {
                const offerSnap = await getDoc(doc(db, "offers", String(offerId)));
                if (!offerSnap.exists()) {
                    document.getElementById("statusText").innerText = "Campaign not found or expired.";
                    return;
                }

                const offer = offerSnap.data();
                if (offer.status && offer.status !== "active") {
                    document.getElementById("statusText").innerText = "This campaign is currently paused.";
                    return;
                }

                // Unique Click ID generate aur Firestore mein save karein
                const clickId = "CLK_" + Date.now() + "_" + Math.floor(100 + Math.random() * 900);
                await setDoc(doc(db, "clicks", clickId), {
                    clickId: clickId,
                    offerId: String(offerId),
                    publisherId: String(publisherId),
                    sub1: sub1,
                    status: "pending",
                    createdAt: new Date().toISOString()
                });

                // Destination URL mein clickId aur sub1 parameters pass karein
                let destUrl = offer.targetUrl;
                const separator = destUrl.includes("?") ? "&" : "?";
                destUrl += `${separator}click_id=${encodeURIComponent(clickId)}&aff_sub=${encodeURIComponent(publisherId)}`;
                if (sub1) {
                    destUrl += `&sub1=${encodeURIComponent(sub1)}`;
                }

                window.location.replace(destUrl);
            } catch (err) {
                document.getElementById("statusText").innerText = "Redirect error: " + err.message;
            }
        }

        processRedirect();
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; color: #334155;">
    <div style="text-align: center;">
        <h3 id="statusText">Redirecting to partner offer, please wait...</h3>
    </div>
</body>
</html>
