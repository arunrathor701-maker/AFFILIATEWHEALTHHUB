<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiliateWealthHub - Login & Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Aapka Firebase Config (Already Updated)
        const firebaseConfig = {
            apiKey: "AIzaSyDO65rF0YI5ifcFnXEwJIy8bGFeSTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a",
            measurementId: "G-PX59VJN9TK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toggleBtn = document.getElementById('toggleBtn');
        const formTitle = document.getElementById('formTitle');

        // Toggle between Login and Register
        let isLogin = true;
        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            if (isLogin) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                formTitle.innerText = "Publisher Login";
                toggleBtn.innerText = "New here? Register Account";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                formTitle.innerText = "Publisher Registration";
                toggleBtn.innerText = "Already have an account? Login";
            }
        });

        // Handle Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                msg.innerText = "Login Successful! Redirecting...";
                msg.className = "text-green-600 text-sm mt-2 font-medium";
                setTimeout(() => {
                    window.location.href = "/affiliate/public/dashboard/index.html";
                }, 1000);
            } catch (error) {
                msg.innerText = "Invalid Email or Password!";
                msg.className = "text-red-600 text-sm mt-2 font-medium";
            }
        });

        // Handle Register
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const msg = document.getElementById('regMsg');

            if (pass.length < 6) {
                msg.innerText = "Password must be at least 6 characters!";
                msg.className = "text-red-600 text-sm mt-2 font-medium";
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                const pubId = Math.floor(100 + Math.random() * 900); // Random 3-digit Publisher ID

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    publisherId: pubId,
                    name: name,
                    email: email,
                    role: email === "arunrathor701@gmail.com" ? "admin" : "publisher",
                    status: "approved",
                    balance: 0,
                    createdAt: new Date().toISOString()
                });

                msg.innerText = "Registration Successful! Redirecting...";
                msg.className = "text-green-600 text-sm mt-2 font-medium";
                setTimeout(() => {
                  const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('redirect') === 'admin' || email === "arunrathor701@gmail.com") {
    window.location.href = "/affiliate/public/admin/index.html";
} else {
    window.location.href = "/affiliate/public/dashboard/index.html";
}
                }, 1000);
            } catch (error) {
                msg.innerText = error.message;
                msg.className = "text-red-600 text-sm mt-2 font-medium";
            }
        });
    </script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
        <!-- Brand Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center text-white">
            <h1 class="text-2xl font-bold tracking-wider">AFFILIATE WEALTH HUB</h1>
            <p class="text-xs text-blue-100 mt-1">CPA Network & Tracking Portal</p>
        </div>

        <div class="p-8">
            <h2 id="formTitle" class="text-xl font-semibold text-slate-800 text-center mb-6">Publisher Login</h2>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="arunrathor701@gmail.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">Login</button>
                <div id="loginMsg" class="text-center"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="regName" required placeholder="e.g. Sonu Kumar" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="regPass" required placeholder="Min 6 characters" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">Register Account</button>
                <div id="regMsg" class="text-center"></div>
            </form>

            <!-- Toggle Button -->
            <div class="mt-6 text-center border-t pt-4">
                <button id="toggleBtn" class="text-sm text-blue-600 hover:text-blue-800 font-medium focus:outline-none">New here? Register Account</button>
            </div>
        </div>
    </div>
</body>
</html>
