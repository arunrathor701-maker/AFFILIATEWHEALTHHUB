<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiliateWealthHub - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDO65rF0YI5ifcFnXEwJIy8bGFeSTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a",
            measurementId: "G-PX59VJN9TK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence);

        window.toggleForm = (type) => {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            const msgBox = document.getElementById('msgBox');
            if(msgBox) msgBox.innerText = "";
            if (type === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('msgBox');
            msg.className = "text-center text-sm text-blue-600 font-semibold mt-3";
            msg.innerText = "Logging in...";

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                const userSnap = await getDoc(doc(db, "users", cred.user.uid));
                const userData = userSnap.exists() ? userSnap.data() : { email: email, name: "Publisher", role: "publisher" };

                localStorage.setItem("awh_user", JSON.stringify({
                    uid: cred.user.uid,
                    email: email,
                    name: userData.name || "Publisher",
                    role: email === "arunrathor701@gmail.com" ? "admin" : (userData.role || "publisher"),
                    publisherId: userData.publisherId || Math.floor(100 + Math.random() * 900)
                }));

                if (email === "arunrathor701@gmail.com" || userData.role === "admin") {
                    window.location.replace("/affiliate/public/admin/index.html");
                } else {
                    window.location.replace("/affiliate/public/dashboard/index.html");
                }
            } catch (err) {
                msg.className = "text-center text-sm text-red-600 font-semibold mt-3";
                msg.innerText = err.message;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const msg = document.getElementById('msgBox');
            msg.className = "text-center text-sm text-blue-600 font-semibold mt-3";
            msg.innerText = "Creating account...";

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                const pubId = Math.floor(100 + Math.random() * 900);
                const role = email === "arunrathor701@gmail.com" ? "admin" : "publisher";

                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    name: name,
                    email: email,
                    publisherId: pubId,
                    role: role,
                    balance: 0,
                    status: "approved",
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem("awh_user", JSON.stringify({ uid: cred.user.uid, email, name, role, publisherId: pubId }));
                window.location.replace(role === "admin" ? "/affiliate/public/admin/index.html" : "/affiliate/public/dashboard/index.html");
            } catch (err) {
                msg.className = "text-center text-sm text-red-600 font-semibold mt-3";
                msg.innerText = err.message;
            }
        });
    </script>
</head>
<body class="bg-blue-700 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center text-white">
            <h1 class="text-2xl font-extrabold tracking-wide">AFFILIATE WEALTH HUB</h1>
            <p class="text-xs text-blue-100 mt-1">CPA Network & Tracking Portal</p>
        </div>

        <div class="p-6">
            <div id="loginSection">
                <h2 class="text-xl font-bold text-slate-800 text-center mb-4">Publisher Login</h2>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="loginEmail" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                        <input type="password" id="loginPass" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow">Login</button>
                </form>
                <p class="text-center text-xs text-slate-500 mt-4">New here? <button type="button" onclick="toggleForm('register')" class="text-blue-600 font-bold">Register Account</button></p>
            </div>

            <div id="registerSection" class="hidden">
                <h2 class="text-xl font-bold text-slate-800 text-center mb-4">Publisher Registration</h2>
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="regName" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="regEmail" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                        <input type="password" id="regPass" required minlength="6" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow">Register Account</button>
                </form>
                <p class="text-center text-xs text-slate-500 mt-4">Already have an account? <button type="button" onclick="toggleForm('login')" class="text-blue-600 font-bold">Login</button></p>
            </div>

            <div id="msgBox"></div>
        </div>
    </div>
</body>
</html>
