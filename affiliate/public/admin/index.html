<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel - AffiliateWealthHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, limit, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0O6SrF0Y15lFcFhXwJIyDbGFsTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a",
            measurementId: "G-PX59VJN9TK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check: Sirf Admin hi ye page khol sake
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/affiliate/public/login/index.html";
                return;
            }
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (!userSnap.exists() || (userSnap.data().role !== "admin" && user.email !== "arunrathor701@gmail.com")) {
                alert("Access Denied! Admin only.");
                window.location.href = "/affiliate/public/dashboard/index.html";
                return;
            }
            loadAllData();
        });

        async function loadAllData() {
            await loadOffers();
            await loadClicks();
            await loadPublishers();
        }

        // 1. Add / Update Offer
        document.getElementById('offerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oid = document.getElementById('offerId').value.trim();
            const name = document.getElementById('offerName').value.trim();
            const category = document.getElementById('offerCat').value.trim();
            const payout = Number(document.getElementById('offerPayout').value);
            const targetUrl = document.getElementById('offerUrl').value.trim();
            const desc = document.getElementById('offerDesc').value.trim();

            try {
                await setDoc(doc(db, "offers", oid), {
                    offerId: oid,
                    name: name,
                    category: category,
                    payout: payout,
                    targetUrl: targetUrl,
                    description: desc,
                    status: "active",
                    updatedAt: new Date().toISOString()
                });
                alert(`Offer #${oid} (${name}) Saved!`);
                document.getElementById('offerForm').reset();
                loadOffers();
            } catch (err) {
                alert("Error saving offer: " + err.message);
            }
        });

        // 2. Load Offers List
        async function loadOffers() {
            const list = document.getElementById('offersList');
            list.innerHTML = "<p class='text-sm text-slate-400 p-4'>Loading offers...</p>";
            const snap = await getDocs(collection(db, "offers"));
            list.innerHTML = "";
            snap.forEach((docSnap) => {
                const o = docSnap.data();
                list.innerHTML += `
                    <div class="p-4 flex flex-col md:flex-row md:items-center justify-between gap-2 border-b">
                        <div>
                            <span class="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded">ID: ${o.offerId}</span>
                            <span class="font-bold text-slate-800 ml-2">${o.name}</span>
                            <span class="text-emerald-600 font-bold ml-2">₹${o.payout}</span>
                            <p class="text-xs text-slate-500 truncate max-w-md mt-1">${o.targetUrl}</p>
                        </div>
                        <button onclick="fillOffer('${o.offerId}', '${o.name}', '${o.category || 'FINANCIAL'}', '${o.payout}', '${o.targetUrl}', '${o.description || ''}')" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg">Edit</button>
                    </div>
                `;
            });
            if (snap.empty) list.innerHTML = "<p class='text-sm text-slate-400 p-4'>No custom offers added yet. Add Offer #57 & #58 above.</p>";
        }

        window.fillOffer = (id, name, cat, payout, url, desc) => {
            document.getElementById('offerId').value = id;
            document.getElementById('offerName').value = name;
            document.getElementById('offerCat').value = cat;
            document.getElementById('offerPayout').value = payout;
            document.getElementById('offerUrl').value = url;
            document.getElementById('offerDesc').value = desc;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 3. Load Recent Clicks & Approve Conversion
        async function loadClicks() {
            const tbody = document.getElementById('clicksTable');
            tbody.innerHTML = "<tr><td colspan='5' class='p-4 text-center text-slate-400'>Loading clicks...</td></tr>";
            const q = query(collection(db, "clicks"), orderBy("createdAt", "desc"), limit(25));
            const snap = await getDocs(q);
            tbody.innerHTML = "";
            snap.forEach((docSnap) => {
                const c = docSnap.data();
                const isApproved = c.status === "approved";
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 text-sm">
                        <td class="p-3 font-mono text-xs">${c.clickId}</td>
                        <td class="p-3 font-semibold">#${c.offerId}</td>
                        <td class="p-3 font-semibold text-blue-600">${c.publisherId}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-xs font-bold ${isApproved ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                                ${c.status.toUpperCase()}
                            </span>
                        </td>
                        <td class="p-3">
                            ${!isApproved ? `<button onclick="approveClick('${c.clickId}', '${c.offerId}', '${c.publisherId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1 rounded font-semibold">Approve Lead</button>` : '<span class="text-xs text-slate-400">Paid</span>'}
                        </td>
                    </tr>
                `;
            });
            if (snap.empty) tbody.innerHTML = "<tr><td colspan='5' class='p-4 text-center text-slate-400'>No clicks recorded yet.</td></tr>";
        }

        // Approve Click & Credit Publisher Wallet
        window.approveClick = async (clickId, offerId, publisherId) => {
            if (!confirm(`Approve conversion for ${clickId} and credit payout to Publisher #${publisherId}?`)) return;
            try {
                // Get Offer Payout
                const offerSnap = await getDoc(doc(db, "offers", String(offerId)));
                const payout = offerSnap.exists() ? Number(offerSnap.data().payout) : 400;

                // Update Click status
                await updateDoc(doc(db, "clicks", clickId), {
                    status: "approved",
                    payoutCredited: payout,
                    approvedAt: new Date().toISOString()
                });

                // Find Publisher by publisherId and increment balance
                const uQuery = query(collection(db, "users"), where("publisherId", "==", Number(publisherId)));
                const uSnap = await getDocs(uQuery);
                if (!uSnap.empty) {
                    const pubDoc = uSnap.docs[0];
                    await updateDoc(doc(db, "users", pubDoc.id), {
                        balance: increment(payout)
                    });
                }

                alert(`Approved! ₹${payout} credited to Publisher #${publisherId}.`);
                loadAllData();
            } catch (err) {
                alert("Error approving: " + err.message);
            }
        };

        // 4. Load Publishers
        async function loadPublishers() {
            const tbody = document.getElementById('pubsTable');
            const snap = await getDocs(collection(db, "users"));
            tbody.innerHTML = "";
            snap.forEach((docSnap) => {
                const u = docSnap.data();
                tbody.innerHTML += `
                    <tr class="border-b text-sm">
                        <td class="p-3 font-bold text-blue-600">${u.publisherId || '-'}</td>
                        <td class="p-3 font-medium">${u.name}</td>
                        <td class="p-3 text-slate-500">${u.email}</td>
                        <td class="p-3 font-bold text-emerald-600">₹${u.balance || 0}</td>
                    </tr>
                `;
            });
        }

        window.logout = () => signOut(auth).then(() => window.location.href = "/affiliate/public/login/index.html");
    </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <!-- Top Bar -->
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="font-bold text-lg">AFFILIATE WEALTH HUB <span class="text-xs bg-amber-500 text-slate-900 px-2 py-0.5 rounded ml-1 font-extrabold">ADMIN</span></h1>
        </div>
        <div class="space-x-3">
            <a href="/affiliate/public/dashboard/index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg">Publisher View</a>
            <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-8">
        <!-- Add / Edit Offer Form -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Add / Update Campaign Offer</h2>
            <form id="offerForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="offerId" required placeholder="Offer ID (e.g. 57)" class="border rounded-lg px-3 py-2 text-sm">
                <input type="text" id="offerName" required placeholder="Offer Name (e.g. Upstox Demat)" class="border rounded-lg px-3 py-2 text-sm">
                <input type="text" id="offerCat" required placeholder="Category (e.g. FINANCIAL)" class="border rounded-lg px-3 py-2 text-sm">
                <input type="number" id="offerPayout" required placeholder="Payout ₹ (e.g. 400)" class="border rounded-lg px-3 py-2 text-sm">
                <input type="url" id="offerUrl" required placeholder="Your Real Affiliate Link (https://...)" class="border rounded-lg px-3 py-2 text-sm md:col-span-2">
                <input type="text" id="offerDesc" required placeholder="Short Description (e.g. Account opening + 1 trade)" class="border rounded-lg px-3 py-2 text-sm md:col-span-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm shadow">Save Campaign</button>
            </form>
            <div id="offersList" class="mt-6 border-t pt-2"></div>
        </div>

        <!-- Live Clicks & Conversions -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
            <div class="p-5 border-b flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">Recent Clicks & Lead Approvals</h2>
                <button onclick="location.reload()" class="text-xs bg-slate-200 px-3 py-1 rounded font-semibold">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                        <tr>
                            <th class="p-3">Click ID</th>
                            <th class="p-3">Offer ID</th>
                            <th class="p-3">Pub ID</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="clicksTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Registered Publishers -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
            <div class="p-5 border-b">
                <h2 class="text-lg font-bold text-slate-800">Registered Publishers & Wallets</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                        <tr>
                            <th class="p-3">Pub ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Wallet Balance</th>
                        </tr>
                    </thead>
                    <tbody id="pubsTable"></tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
