<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiliateWealthHub - Partner Dashboard</title>
    <!-- Tailwind CSS with fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#eff6ff', 600: '#2563eb', 700: '#1d4ed8' } } } }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where, updateDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDO06SrF0Y15lFcFhXwJIyDbGFsTuxoswY",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem("awh_user") || "null");
        let currentBalance = 0;
        let cachedClicks = [];
        let cachedPayouts = [];
        let myChart = null;

        function safeSetText(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('fixedToast');
            if (!toast) return;
            toast.innerText = message;
            toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl text-xs font-bold transition-all duration-300 z-50 text-white pointer-events-none ${isError ? 'bg-red-600' : 'bg-slate-900'}`;
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
            }, 3000);
        }

        window.switchTab = function(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const activeTab = document.getElementById(tabId);
            if (activeTab) activeTab.classList.remove('hidden');
            
            document.querySelectorAll('.nav-link').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                el.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            if (btnEl) {
                btnEl.classList.remove('text-slate-600', 'hover:bg-slate-100');
                btnEl.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            }
        };

        async function initDashboard() {
            if (!currentUser || !currentUser.uid) {
                window.location.replace("/affiliate/public/login/index.html");
                return;
            }
            updateUI();
            setupRealtimeListeners();
            loadOffers();
        }

        function updateUI() {
            const name = currentUser.name || "Arun Rathore";
            const pubId = currentUser.publisherId || "662";
            const email = currentUser.email || "arunrathor701@gmail.com";

            document.querySelectorAll('.pubNameDisplay').forEach(el => el.innerText = name);
            safeSetText('pubIdDisplay', pubId);
            
            const profPubId = document.getElementById('profilePubId');
            const profName = document.getElementById('profileName');
            const profEmail = document.getElementById('profileEmail');
            if (profPubId) profPubId.value = pubId;
            if (profName) profName.value = name;
            if (profEmail) profEmail.value = email;
        }

        function setupRealtimeListeners() {
            const pubId = String(currentUser.publisherId || "662");
            const userRef = doc(db, "users", currentUser.uid);

            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentBalance = Number(data.balance || 0);
                    safeSetText('walletBalance', `₹${currentBalance}`);
                    safeSetText('totalEarnings', `₹${currentBalance}`);
                    safeSetText('modalAvailBal', `₹${currentBalance}`);
                }
            });

            const clicksQuery = query(collection(db, "clicks"), where("publisherId", "==", pubId));
            onSnapshot(clicksQuery, (snapshot) => {
                let totalClicks = 0;
                let approvedCount = 0;
                const clicksListHtml = [];
                cachedClicks = [];

                snapshot.forEach((docSnap) => {
                    totalClicks++;
                    const data = docSnap.data();
                    const status = (data.status || "pending").toLowerCase();
                    const isApproved = status === "approved";
                    if (isApproved) approvedCount++;

                    const dateStr = data.createdAt ? new Date(data.createdAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : 'N/A';
                    const badgeClass = isApproved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';

                    cachedClicks.push({
                        Date: dateStr,
                        ClickID: data.clickId || docSnap.id,
                        Offer: `Offer #${data.offerId || '1'}`,
                        SubID: data.sub1 || 'Direct',
                        Status: data.status || 'Recorded'
                    });

                    clicksListHtml.push(`
                        <tr class="border-b hover:bg-slate-50">
                            <td class="p-3 text-xs">${dateStr}</td>
                            <td class="p-3 text-xs font-mono text-slate-500">${data.clickId || docSnap.id}</td>
                            <td class="p-3 text-xs font-semibold">Offer #${data.offerId || '1'}</td>
                            <td class="p-3 text-xs font-mono font-bold text-blue-600">${data.sub1 || 'Direct'}</td>
                            <td class="p-3 text-xs"><span class="px-2 py-0.5 ${badgeClass} rounded text-[10px] font-bold uppercase">${data.status || 'Recorded'}</span></td>
                        </tr>
                    `);
                });

                safeSetText('totalClicksDisplay', totalClicks);
                safeSetText('totalConvDisplay', approvedCount);

                const clicksBody = document.getElementById('clicksTableBody');
                if (clicksBody) {
                    clicksBody.innerHTML = clicksListHtml.join('') || `<tr><td colspan="5" class="p-4 text-center text-slate-400">No clicks recorded yet.</td></tr>`;
                }

                updateChart(totalClicks, approvedCount);
            });

            const payoutsQuery = query(collection(db, "payouts"), where("publisherId", "==", pubId));
            onSnapshot(payoutsQuery, (snapshot) => {
                const rows = [];
                cachedPayouts = [];
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const dStr = p.requestedAt ? new Date(p.requestedAt).toLocaleDateString('en-IN') : 'N/A';
                    const stColor = p.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';

                    cachedPayouts.push({
                        Date: dStr,
                        Amount: p.amount || 0,
                        Method: p.method || 'N/A',
                        Status: p.status || 'Pending'
                    });

                    rows.push(`
                        <tr class="border-b hover:bg-slate-50">
                            <td class="p-3 text-xs">${dStr}</td>
                            <td class="p-3 text-xs font-bold text-slate-900">₹${p.amount || 0}</td>
                            <td class="p-3 text-xs">${p.method || 'N/A'}</td>
                            <td class="p-3 text-xs"><span class="px-2 py-0.5 ${stColor} rounded text-[10px] font-bold uppercase">${p.status || 'Pending'}</span></td>
                        </tr>
                    `);
                });
                const tbody = document.getElementById('payoutsTableBody');
                if (tbody) tbody.innerHTML = rows.join('') || `<tr><td colspan="4" class="p-4 text-center text-slate-400">No payout history.</td></tr>`;
            });
        }

        async function loadOffers() {
            const container = document.getElementById('offersList');
            if (!container) return;
            const pubId = currentUser.publisherId || "662";
            try {
                const snap = await getDocs(collection(db, "offers"));
                container.innerHTML = "";
                snap.forEach(docSnap => {
                    const o = docSnap.data();
                    const baseTrackingUrl = `https://affiliatewealthhub.online/go?oid=${docSnap.id}&pid=${pubId}`;
                    container.innerHTML += `
                        <div class="p-4 bg-white border-b flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-slate-50">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">${o.name || 'Campaign'}</h4>
                                <span class="text-xs text-slate-500">Category: ${o.category || 'Financial'} | Payout: ₹${o.payout || 0}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="text" id="subInput_${docSnap.id}" placeholder="Sub-ID (e.g. Atul)" class="border rounded-lg px-3 py-1.5 text-xs w-36 outline-none focus:ring-2 focus:ring-blue-500">
                                <button type="button" onclick="generateAndCopyLink('${baseTrackingUrl}', 'subInput_${docSnap.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow transition cursor-pointer">
                                    Copy Link
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<div class="p-4 text-red-500 text-xs">Error loading offers.</div>`;
            }
        }

        window.generateAndCopyLink = (baseUrl, inputId) => {
            const subInput = document.getElementById(inputId);
            const subVal = subInput ? subInput.value.trim() : "";
            const finalUrl = subVal ? `${baseUrl}&sub1=${encodeURIComponent(subVal)}` : baseUrl;
            navigator.clipboard.writeText(finalUrl).then(() => {
                showToast("✓ Tracking Link Copied!");
            }).catch(() => {
                showToast("Link: " + finalUrl);
            });
        };

        window.exportCSV = (filename, dataArray) => {
            if (!dataArray || dataArray.length === 0) {
                showToast("No data available to export.", true);
                return;
            }
            const headers = Object.keys(dataArray[0]);
            const csvRows = [headers.join(',')];
            for (const row of dataArray) {
                const values = headers.map(h => `"${('' + row[h]).replace(/"/g, '""')}"`);
                csvRows.push(values.join(','));
            }
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("✓ CSV Report Downloaded!");
        };

        window.openPayoutModal = () => {
            if (currentBalance < 100) {
                showToast("Minimum withdrawal ₹100 hai. Current balance: ₹" + currentBalance, true);
                return;
            }
            document.getElementById('withdrawAmount').value = currentBalance;
            document.getElementById('payoutModal').classList.remove('hidden');
        };

        window.closePayoutModal = () => {
            document.getElementById('payoutModal').classList.add('hidden');
        };

        window.submitPayoutRequest = async (e) => {
            e.preventDefault();
            const amount = Number(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value.trim();

            if (!method || amount < 100 || amount > currentBalance) {
                showToast("Valid amount aur UPI/Bank details dalein.", true);
                return;
            }

            try {
                await addDoc(collection(db, "payouts"), {
                    publisherId: String(currentUser.publisherId || "662"),
                    publisherName: currentUser.name || "Publisher",
                    uid: currentUser.uid || "",
                    amount: amount,
                    method: method,
                    status: "pending",
                    requestedAt: new Date().toISOString()
                });
                closePayoutModal();
                document.getElementById('withdrawMethod').value = "";
                showToast("✓ Withdrawal request submitted!");
            } catch (err) {
                showToast("Error: " + err.message, true);
            }
        };

        window.saveProfile = async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('profileName');
            if (!nameInput) return;
            const newName = nameInput.value.trim();
            if (!newName || !currentUser.uid) return;
            try {
                await updateDoc(doc(db, "users", currentUser.uid), { name: newName });
                currentUser.name = newName;
                localStorage.setItem("awh_user", JSON.stringify(currentUser));
                updateUI();
                showToast("✓ Profile updated!");
            } catch (err) {
                showToast("Error updating profile: " + err.message, true);
            }
        };

        window.logout = () => {
            localStorage.removeItem("awh_user");
            signOut(auth).then(() => window.location.replace("/affiliate/public/login/index.html"));
        };

        function updateChart(clicks, convs) {
            const canvas = document.getElementById('perfChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Total Clicks', 'Approved Leads'],
                    datasets: [{
                        label: 'Count',
                        data: [clicks, convs],
                        backgroundColor: ['#2563eb', '#10b981'],
                        borderRadius: 8,
                        barThickness: 55
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</head>
<body class="h-full bg-slate-100 font-sans text-slate-800">
    <div id="fixedToast" style="opacity:0; transform:translateY(20px);" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold transition-all duration-300 z-50 pointer-events-none"></div>

    <div id="payoutModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-extrabold text-base text-slate-900">Request Withdrawal</h3>
                <button type="button" onclick="closePayoutModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg cursor-pointer">&times;</button>
            </div>
            <form onsubmit="submitPayoutRequest(event)" class="space-y-4 text-xs">
                <div class="bg-blue-50 p-3 rounded-xl flex justify-between items-center">
                    <span class="font-bold text-slate-600">Available Wallet Balance:</span>
                    <span id="modalAvailBal" class="font-black text-base text-blue-700">₹0</span>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 mb-1 uppercase">Withdrawal Amount (₹)</label>
                    <input type="number" id="withdrawAmount" min="100" class="w-full border border-slate-300 p-3 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 mb-1 uppercase">UPI ID / Bank Account Details</label>
                    <input type="text" id="withdrawMethod" placeholder="e.g. 9479532362@ybl or Bank A/C + IFSC" class="w-full border border-slate-300 p-3 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closePayoutModal()" class="px-4 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-100 cursor-pointer">Cancel</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold shadow cursor-pointer">Submit Request</button>
                </div>
            </form>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col shrink-0">
            <div class="p-5 border-b flex items-center space-x-3">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white text-sm overflow-hidden">
                    <img src="" alt="AWH" onerror="this.style.display='none'; this.parentElement.innerText='AWH';" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 class="font-bold text-slate-900 text-sm">AffiliateWealthHub</h2>
                    <span class="text-[10px] text-slate-400 block font-bold uppercase">Partner Portal</span>
                </div>
            </div>
            
            <div class="flex-1 py-4 px-3 space-y-1 text-xs font-semibold">
                <button type="button" onclick="switchTab('tab-dashboard', this)" class="nav-link w-full flex items-center space-x-3 px-3 py-2.5 bg-blue-600 text-white rounded-lg transition text-left shadow-sm cursor-pointer">
                    <span>📊 Dashboard</span>
