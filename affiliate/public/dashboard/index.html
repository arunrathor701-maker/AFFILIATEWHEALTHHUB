<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Dashboard - AffiliateWealthHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDO65rF0YI5ifcFnXEwJIy8bGFeSTuxosw",
            authDomain: "affiliatewealthhub-542e0.firebaseapp.com",
            projectId: "affiliatewealthhub-542e0",
            storageBucket: "affiliatewealthhub-542e0.firebasestorage.app",
            messagingSenderId: "1088047960863",
            appId: "1:1088047960863:web:bd7fe0e8e0404fdf9bb562a",
            measurementId: "G-PX59VJN9TK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const savedUser = JSON.parse(localStorage.getItem("awh_user") || "null");
        if (!savedUser) {
            window.location.replace("/affiliate/public/login/index.html");
        } else {
            document.getElementById('dashBody').classList.remove('hidden');
            initDashboard();
        }

        let currentPublisherId = savedUser ? savedUser.publisherId : "662";
        let activeOfferId = "";

        async function initDashboard() {
            document.getElementById('pubName').innerText = savedUser.name || "Publisher";
            document.getElementById('pubEmail').innerText = savedUser.email || "";
            document.getElementById('pubIdDisplay').innerText = currentPublisherId;

            try {
                if (savedUser.uid) {
                    const userDoc = await getDoc(doc(db, "users", savedUser.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        currentPublisherId = data.publisherId || currentPublisherId;
                        document.getElementById('pubName').innerText = data.name || savedUser.name;
                        document.getElementById('pubIdDisplay').innerText = currentPublisherId;
                        document.getElementById('walletBalance').innerText = `₹${data.balance || 0}`;
                    }
                } else if (savedUser.email) {
                    const q = query(collection(db, "users"), where("email", "==", savedUser.email));
                    const qSnap = await getDocs(q);
                    if (!qSnap.empty) {
                        const data = qSnap.docs[0].data();
                        currentPublisherId = data.publisherId || currentPublisherId;
                        document.getElementById('pubIdDisplay').innerText = currentPublisherId;
                        document.getElementById('walletBalance').innerText = `₹${data.balance || 0}`;
                    }
                }
            } catch (e) {
                console.error("Profile error:", e);
            }

            await loadCampaigns();
        }

        async function loadCampaigns() {
            const container = document.getElementById('offersContainer');
            try {
                const snap = await getDocs(collection(db, "offers"));
                container.innerHTML = "";
                if (snap.empty) {
                    container.innerHTML = `<div class="p-6 text-center text-sm text-slate-500">No active campaigns available right now.</div>`;
                    return;
                }
                snap.forEach((docSnap) => {
                    const o = docSnap.data();
                    const oid = o.offerId || docSnap.id;
                    const name = o.name || "Campaign";
                    const payout = o.payout || 0;
                    const cat = (o.category || "FINANCIAL").toUpperCase();
                    const desc = o.description || "Complete campaign steps.";

                    container.innerHTML += `
                        <div class="p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-slate-50 transition">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs font-semibold rounded uppercase">${cat}</span>
                                    <span class="text-xs text-slate-400 font-mono">#${oid}</span>
                                </div>
                                <h3 class="font-bold text-lg text-slate-800 mt-1">${name}</h3>
                                <p class="text-sm text-slate-500">${desc}</p>
                            </div>
                            <div class="flex items-center justify-between md:space-x-6">
                                <div class="text-right md:text-left">
                                    <span class="text-xs text-slate-400 block">Payout</span>
                                    <span class="font-bold text-emerald-600 text-lg">₹${payout} / Lead</span>
                                </div>
                                <button onclick="generateLink('${oid}', '${name.replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-semibold text-sm shadow-md transition">Get Link</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<div class="p-6 text-center text-sm text-red-600 font-semibold">Error: ${err.message}</div>`;
            }
        }

        window.logout = () => {
            localStorage.removeItem("awh_user");
            signOut(auth).then(() => window.location.replace("/affiliate/public/login/index.html"));
        };

        window.generateLink = (offerId, offerName) => {
            activeOfferId = offerId;
            document.getElementById('modalOfferName').innerText = offerName;
            document.getElementById('subIdInput').value = "";
            updateTrackingLink();
            document.getElementById('linkModal').classList.remove('hidden');
        };

        window.updateTrackingLink = () => {
            const subId = document.getElementById('subIdInput').value.trim();
            let trackingLink = `https://affiliatewealthhub.online/go/index.html?oid=${activeOfferId}&pid=${currentPublisherId}`;
            if (subId) {
                trackingLink += `&sub1=${encodeURIComponent(subId)}`;
            }
            document.getElementById('trackingLinkInput').value = trackingLink;
        };

        window.closeModal = () => document.getElementById('linkModal').classList.add('hidden');

        window.copyLink = () => {
            const input = document.getElementById('trackingLinkInput');
            navigator.clipboard.writeText(input.value);
            alert("Tracking link copied!");
        };
    </script>
</head>
<body id="dashBody" class="bg-slate-100 min-h-screen font-sans hidden">
    <nav class="bg-slate-900 text-white px-6 py-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white font-bold p-2 rounded-lg">AWH</span>
            <div>
                <h1 class="font-bold text-lg leading-none">AffiliateWealthHub</h1>
                <span class="text-xs text-slate-400">Publisher Portal</span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right hidden md:block">
                <div id="pubName" class="font-semibold text-sm">Publisher</div>
                <div id="pubEmail" class="text-xs text-slate-400"></div>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-sm px-4 py-2 rounded-lg font-medium transition">Logout</button>
        </div>
    </nav>

    <main class="p-6 max-w-6xl mx-auto space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-6 text-white shadow-lg">
                <h3 class="text-emerald-100 font-medium text-sm">Wallet Balance</h3>
                <div id="walletBalance" class="text-3xl font-bold mt-2">₹0</div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
                <h3 class="text-slate-500 font-medium text-sm">Your Publisher ID</h3>
                <div id="pubIdDisplay" class="text-3xl font-bold text-slate-800 mt-2">662</div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 flex items-center justify-between">
                <div>
                    <h3 class="text-slate-500 font-medium text-sm">Account Status</h3>
                    <span class="inline-block mt-2 px-3 py-1 bg-green-100 text-green-800 text-xs font-bold rounded-full uppercase">Approved</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">Active Campaigns</h2>
                <button onclick="location.reload()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded font-semibold">Refresh Offers</button>
            </div>
            <div id="offersContainer" class="divide-y divide-slate-100">
                <div class="p-6 text-center text-sm text-slate-400">Loading live campaigns...</div>
            </div>
        </div>
    </main>

    <!-- Tracking Link Modal with Sub ID -->
    <div id="linkModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalOfferName" class="font-bold text-lg text-slate-800">Offer Name</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Team / Sub ID (Optional)</label>
                <input type="text" id="subIdInput" oninput="updateTrackingLink()" placeholder="e.g. team_rahul or source1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-blue-500">
                <p class="text-[11px] text-slate-400 mt-1">Apni team member ka naam ya code likhein — link apne aap update ho jayega.</p>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Your Unique Tracking Link</label>
                <div class="flex">
                    <input type="text" id="trackingLinkInput" readonly class="w-full bg-slate-100 border rounded-l-lg px-3 py-2 text-sm text-slate-600 focus:outline-none">
                    <button onclick="copyLink()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 rounded-r-lg font-semibold text-sm">Copy</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
