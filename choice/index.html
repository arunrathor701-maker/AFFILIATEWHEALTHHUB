  <!-- Fallback redirect -->
  <meta http-equiv="refresh" content="0; url=https://nexoffers.in/tracking/12282/112801">

  <script>
    (function() {
      const baseUrl = "https://nexoffers.in/tracking/12282/112801";
      const urlParams = new URLSearchParams(window.location.search);
      
      const clickId = urlParams.get('aff_click_id') || urlParams.get('click_id') || '';
      const subAffId = urlParams.get('sub_aff_id') || urlParams.get('subid') || '';

      const trackingParams = new URLSearchParams();
      trackingParams.set('aff_click_id', clickId);
      trackingParams.set('sub_aff_id', subAffId);

      window.location.replace(baseUrl + '?' + trackingParams.toString());
    })();
  </script>
