<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choice Broking | Free Demat Account</title>

  <script>
    (function() {
      // आपका बेस ट्रैकिंग लिंक
      const baseUrl = "https://nexoffers.in/tracking/12282/112801";

      // करंट लिंक से सारे पैरामीटर्स निकालना
      const urlParams = new URLSearchParams(window.location.search);

      // 1. Click Affiliate ID (aff_click_id या click_id)
      const affClickId = urlParams.get('aff_click_id') || urlParams.get('click_id') || '';

      // 2. Sub Affiliate ID (sub_aff_id या agent_id)
      const subAffId = urlParams.get('sub_aff_id') || urlParams.get('agent_id') || '';

      // 3. Sub ID (sub_id या source/campaign tag)
      const subId = urlParams.get('sub_id') || urlParams.get('subid') || '';

      // नेक्सऑफर्स के लिए ट्रैकिंग पैरामीटर्स सेट करना
      const trackingParams = new URLSearchParams();

      if (affClickId) {
        trackingParams.set('aff_click_id', affClickId);
      }
      if (subAffId) {
        trackingParams.set('sub_aff_id', subAffId);
      }
      if (subId) {
        trackingParams.set('sub_id', subId);
      }

      // फ़ाइनल रिडायरेक्ट यूआरएल तैयार करना
      const paramString = trackingParams.toString();
      const redirectUrl = paramString ? (baseUrl + '?' + paramString) : baseUrl;

      // फ़ास्ट रिडायरेक्शन
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 25%; color: #222;">
  <h2>Connecting to Choice Broking...</h2>
  <p>Please wait, redirecting to the official registration page securely.</p>
</body>
</html>
