<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // 1. बेस अफ़िलिएट यूआरएल (बिना एक्स्ट्रा पैरामीटर के)
        const baseUrl = "https://paisakmao.in/c?cid=32&uid=86&p1=13199";

        // 2. यूजर के डोमेन से सारे Query Parameters निकालना (उदा. ?subid=xyz या ?click_id=123)
        const currentParams = window.location.search;

        let finalUrl = baseUrl;

        if (currentParams) {
            // URLSearchParams की मदद से पैरामीटर्स जोड़ना
            const incomingParams = new URLSearchParams(currentParams);
            const targetUrl = new URL(baseUrl);

            // जो भी पैरामीटर आपके डोमेन में आएंगे, वो सीधे Paisakmao लिंक में जुड़ जाएंगे
            incomingParams.forEach((value, key) => {
                targetUrl.searchParams.set(key, value);
            });

            finalUrl = targetUrl.toString();
        }

        // 3. रीडायरेक्ट करना
        window.location.replace(finalUrl);
    </script>
</head>
<body>
    <p>Redirecting, please wait...</p>
</body>
</html>
